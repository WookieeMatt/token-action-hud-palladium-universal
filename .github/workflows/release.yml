name: Release

# Publishes a GitHub Release (module.json + module.zip) whenever module.json changes on main, or on demand.
# Foundry installs from: https://github.com/<owner>/<repo>/releases/latest/download/module.json
on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Point the download at this release
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.v.outputs.version }}/module.zip"
          jq --arg u "$url" '.download = $u' module.json > module.tmp && mv module.tmp module.json

      - name: Package
        run: |
          zip -r module.zip module.json README.md LICENSE CHANGELOG.md languages scripts styles
          unzip -l module.zip | tail -1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Token Action HUD Palladium Universal v${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Install or update in Foundry VTT v14 with the manifest URL:
            https://github.com/${{ github.repository }}/releases/latest/download/module.json

            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            module.json
            module.zip
